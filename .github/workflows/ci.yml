name: CI

# Compiles the iOS app on a macOS runner. Requires GitHub-hosted macOS Actions
# minutes (or a self-hosted Mac). If the account has no macOS minutes, this job
# fails fast with "no runner" — enable macOS Actions (set an Actions spending
# limit) and it runs automatically on every push/PR.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project LegacyNetwork.xcodeproj \
            -scheme LegacyNetwork \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
