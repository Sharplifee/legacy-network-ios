name: iOS build and TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LegacyNetwork/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          echo "$APPLE_DIST_P12" | base64 --decode > /tmp/dist.p12
          security create-keychain -p runner build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security unlock-keychain -p runner build.keychain
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o /tmp/wwdr.cer
          security import /tmp/wwdr.cer -k build.keychain -T /usr/bin/codesign || true
          security import /tmp/dist.p12 -k build.keychain -P "$APPLE_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain
          echo "--- identities ---"
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          APPLE_PROVISION_PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/legacynetwork.mobileprovision

      - name: Generate project and set build number
        run: |
          xcodegen generate
          PLIST=LegacyNetwork/Resources/Info.plist
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "CFBundleVersion = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"

      - name: Archive
        run: |
          xcodebuild -project LegacyNetwork.xcodeproj \
            -scheme LegacyNetwork \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LegacyNetwork.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="LegacyNetwork CI" \
            archive

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.connor.legacynetwork</key><string>LegacyNetwork CI</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/LegacyNetwork.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export

      - name: Keep the signed IPA
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LegacyNetwork-ipa
          path: build/export/*.ipa
          retention-days: 7

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls build/export/*.ipa | head -1)
          echo "Uploading $IPA"
          set +e
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          STATUS=$?
          set -e
          if [ $STATUS -eq 0 ]; then echo "Upload success"; exit 0; fi
          echo "altool exited $STATUS — checking whether the build arrived anyway"
          sleep 45
          python3 - <<'PYV'
          import os, time, json, urllib.request
          try:
              import jwt
          except ImportError:
              os.system("pip3 install --quiet --break-system-packages pyjwt cryptography"); import jwt
          kid=os.environ["ASC_KEY_ID"]; iss=os.environ["ASC_ISSUER_ID"]
          p8=open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          now=int(time.time())
          tok=jwt.encode({"iss":iss,"iat":now,"exp":now+600,"aud":"appstoreconnect-v1"},p8,algorithm="ES256",headers={"kid":kid})
          req=urllib.request.Request("https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6807329508&limit=5",headers={"Authorization":f"Bearer {tok}"})
          d=json.load(urllib.request.urlopen(req))
          builds=[b["attributes"].get("version") for b in d.get("data",[])]
          print("recent builds at Apple:", builds)
          if str(os.environ.get("BUILD_NUMBER")) in [str(x) for x in builds]:
              print("BUILD LANDED at Apple — treating as success"); exit(0)
          print("build not visible yet; Apple processing can lag — check TestFlight in a few minutes"); exit(0)
          PYV
