<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Legacy Network">
<meta name="theme-color" content="#3171CC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Legacy Network</title>
<style>
  :root{
    --blue:#3171CC; --blue-field:#4E86D6; --teal:#21BCAA; --dark:#191C22; --dark2:#20242C;
    --bg:#F4F6F8; --card:#FFFFFF; --line:#EAEDF2; --ink:#1B1E23; --mut:#8A94A6;
    --yellow:#F4B740; --r:12px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--dark);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  .app{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:var(--bg);overflow:hidden}
  .hide{display:none!important}

  /* SPLASH */
  #splash{position:fixed;inset:0;background:var(--blue);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s}
  #splash svg{width:120px;height:120px}
  #splash b{color:#fff;font-size:30px;font-weight:800}

  /* LOGIN */
  #login{position:fixed;inset:0;background:var(--blue);z-index:90;overflow-y:auto;
    padding:calc(60px + var(--safe-t)) 30px calc(30px + var(--safe-b));display:flex;flex-direction:column;align-items:center}
  #login .logo{display:flex;align-items:center;gap:16px;margin:10px 0 60px}
  #login .logo svg{width:96px;height:96px}
  #login .logo .wm{display:flex;flex-direction:column;line-height:.9}
  #login .logo .wm b{color:#fff;font-size:44px;font-weight:800;letter-spacing:1px}
  #login .logo .wm span{color:#fff;font-size:20px;font-weight:300;letter-spacing:10px;margin-top:6px}
  .seg{display:flex;background:#fff;border-radius:999px;padding:0;width:100%;max-width:360px;margin:0 auto 30px;overflow:hidden;border:2px solid #fff}
  .seg button{flex:1;border:none;background:#fff;color:var(--blue);font-family:inherit;font-size:17px;font-weight:600;padding:15px;border-radius:999px}
  .seg button.off{background:var(--blue);color:#fff}
  #login label{align-self:flex-start;color:#fff;font-size:17px;margin:10px 2px 8px;width:100%;max-width:520px}
  .field{width:100%;max-width:520px;position:relative;margin-bottom:6px}
  .field input{width:100%;height:64px;border:none;border-radius:var(--r);background:var(--blue-field);
    color:#fff;font-size:16px;font-style:italic;padding:0 64px 0 20px;font-family:inherit}
  .field input::placeholder{color:#EAF1FF;font-style:italic;opacity:.9}
  .field .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;color:#fff}
  .field .ic svg{width:26px;height:26px;fill:#fff}
  #login .links{width:100%;max-width:520px;text-align:center;margin-top:20px;display:flex;flex-direction:column;gap:16px}
  #login .links a{color:#fff;font-size:16px;text-decoration:none;font-weight:500}
  #login .go{width:100%;max-width:520px;height:64px;border:none;border-radius:999px;background:#C9D6F0;color:#3F567E;
    font-size:19px;font-weight:600;font-family:inherit;margin-top:40px}
  #login .go:active{transform:translateY(1px)}

  /* APP SHELL */
  #shell{min-height:100vh;background:var(--bg)}
  .topbar{position:sticky;top:0;z-index:40;background:var(--dark);height:calc(64px + var(--safe-t));padding-top:var(--safe-t);
    display:flex;align-items:center;justify-content:space-between;padding-left:18px;padding-right:18px}
  .burger{width:52px;height:46px;border-radius:12px;background:#262B33;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 12px}
  .burger i{height:3px;background:#4A90E2;border-radius:2px;display:block}
  .topbar .av{width:56px;height:56px;border-radius:50%;background-size:cover;background-position:center;border:2px solid #333}

  main{padding:16px 14px calc(30px + var(--safe-b))}
  .view{display:none}.view.active{display:block;animation:f .25s ease}
  @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 16px 14px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
  .chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .chart-head h2{font-size:22px;font-weight:700;color:#1B1E23}
  .rangesel{display:flex;align-items:center;gap:6px;color:#1B1E23;font-size:16px;font-weight:500;background:none;border:none;font-family:inherit}
  .rangesel svg{width:16px;height:16px;fill:#1B1E23}
  .legend{display:flex;gap:26px;justify-content:center;margin:6px 0 4px;font-size:15px}
  .legend span{display:flex;align-items:center;gap:8px;color:#1B1E23}
  .legend i{width:26px;height:12px;border-radius:2px;display:inline-block}

  /* generic screens */
  .ph{padding:30px 20px;text-align:center;color:var(--mut)}
  .ph .pic{width:64px;height:64px;border-radius:16px;background:#EAF1FF;color:var(--blue);display:flex;align-items:center;justify-content:center;margin:40px auto 16px}
  .ph .pic svg{width:32px;height:32px;fill:var(--blue)}
  .ph h3{color:#1B1E23;font-size:19px;margin-bottom:6px}
  .list-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.05)}
  .lrow{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line)}
  .lrow:last-child{border:none}
  .lrow .li{width:40px;height:40px;border-radius:10px;background:#EAF1FF;color:var(--blue);display:flex;align-items:center;justify-content:center}
  .lrow .li svg{width:20px;height:20px;fill:var(--blue)}
  .lrow .m{flex:1}.lrow .m b{font-size:15px;display:block}.lrow .m span{font-size:13px;color:var(--mut)}
  .lrow .chev{color:var(--mut)}

  /* DRAWER */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
  #scrim.open{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:400px;background:var(--dark);z-index:70;
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    padding-top:calc(var(--safe-t) + 16px);display:flex;flex-direction:column;overflow-y:auto}
  #drawer.open{transform:none}
  #drawer .dhead{display:flex;justify-content:flex-end;padding:0 20px 8px}
  #drawer .dav{width:64px;height:64px;border-radius:50%;background-size:cover;background-position:center;border:2px solid #333}
  #drawer .beta{background:#E5343D;color:#fff;font-size:14px;font-weight:800;padding:5px 14px;border-radius:8px;margin:6px 0 6px 20px;align-self:flex-start}
  .ditem{display:flex;align-items:center;gap:20px;padding:19px 22px;color:#AEB6C2;font-size:19px;border-bottom:1px solid #262B33}
  .ditem svg{width:26px;height:26px;fill:#AEB6C2;flex-shrink:0}
  .ditem.on{background:#2A2F38;color:#4A90E2}
  .ditem.on svg{fill:#4A90E2}

  .fab{position:fixed;bottom:calc(22px + var(--safe-b));right:18px;width:58px;height:58px;border-radius:50%;
    background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(49,113,204,.4);z-index:50}
  .fab svg{width:26px;height:26px;fill:#fff}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
function segSel(x){$("#segD").classList.toggle("off",x!=="D");$("#segC").classList.toggle("off",x!=="C");}

const ICONS={
  home:'<path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/>',
  mail:'<path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/>',
  cal:'<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14z"/>',
  brief:'<path d="M20 7h-4V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zm-6 0h-4V5h4z"/>',
  bulb:'<path d="M9 21h6v-1H9zm3-19A7 7 0 0 0 5 9c0 3 2 4 3 6h8c1-2 3-3 3-6a7 7 0 0 0-7-7z"/>',
  cart:'<path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM7.2 14h9.5l3.8-8H5.2L4.3 4H1v2h2l3.6 7.6-1.3 2.4c-.5 1 .2 2 1.3 2h12v-2H7.2z"/>',
  folder:'<path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/>',
  trophy:'<path d="M18 2H6v2H2v4a4 4 0 0 0 4 4 6 6 0 0 0 5 3v3H8v2h8v-2h-3v-3a6 6 0 0 0 5-3 4 4 0 0 0 4-4V4h-4zM6 10a2 2 0 0 1-2-2V6h2zm14-2a2 2 0 0 1-2 2V6h2z"/>',
  gear:'<path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.5H10.9l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.8 7.8 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 1.7 1l.4 2.5h4.2l.4-2.5a7.3 7.3 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>',
  bell:'<path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5a6 6 0 0 0-5-5.9V4a1 1 0 0 0-2 0v1.1A6 6 0 0 0 6 11v5l-2 2v1h16v-1z"/>',
  out:'<path d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8a2 2 0 0 0-2 2v4h2V5h8v14h-8v-4h-2v4a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/>',
  chat:'<path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>'
};
const NAV=[
  ["Dashboard","home","dashboard"],["Email","mail","Email"],["Events","cal","Events"],
  ["Business Building","brief","Business Building"],["Training","bulb","Training"],["Store","cart","Store"],
  ["Storage","folder","Storage"],["Achievements","trophy","Achievements"],["Settings","gear","Settings"],
  ["Notifications","bell","Notifications"],["Log Out","out","__logout"]
];
let active="dashboard";
function renderNav(){
  $("#nav").innerHTML=NAV.map(([label,ic,key])=>`
    <div class="ditem ${key===active?'on':''}" onclick="navGo('${key}','${label.replace(/'/g,"")}')">
      <svg viewBox="0 0 24 24">${ICONS[ic]}</svg>${label}</div>`).join("");
}
function navGo(key,label){
  closeDrawer();
  if(key==='__logout'){logout();return;}
  active=key;
  if(key==='dashboard'){show('v-dashboard');}
  else{ genericScreen(label); show('v-generic'); }
  renderNav();
}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo(0,0);}
function genericScreen(label){
  const map={Email:'mail',Events:'cal','Business Building':'brief',Training:'bulb',Store:'cart',Storage:'folder',Achievements:'trophy',Settings:'gear',Notifications:'bell'};
  $("#v-generic").innerHTML=`<div class="ph"><div class="pic"><svg viewBox="0 0 24 24">${ICONS[map[label]||'home']}</svg></div>
    <h3>${label}</h3><p>This section mirrors the live ${label} area.</p></div>`;
}

function openDrawer(){renderNav();$("#drawer").classList.add("open");$("#scrim").classList.add("open");}
function closeDrawer(){$("#drawer").classList.remove("open");$("#scrim").classList.remove("open");}

/* charts */
function months(n){const all=["OCT","NOV","DEC","JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP"];return all;}
function lineChart(el,{pts,color,fill,max=140,step=10,labels}){
  const W=340,H=300,padL=34,padB=26,padT=8,padR=6;
  const iw=W-padL-padR, ih=H-padT-padB;
  const n=pts.length;
  const x=i=>padL + iw*(i/(n-1));
  const y=v=>padT + ih*(1 - v/max);
  let grid="";
  for(let g=0;g<=max;g+=step){const gy=y(g);grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#EDF0F4"/><text x="${padL-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="#B7BECB">${g}</text>`;}
  let lab="";labels.forEach((m,i)=>{lab+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#AAB2C0">${m}</text>`;});
  // smooth path
  let d="";pts.forEach((p,i)=>{d+=(i?` L`:`M`)+` ${x(i).toFixed(1)} ${y(p).toFixed(1)}`;});
  const area=d+` L ${x(n-1)} ${y(0)} L ${x(0)} ${y(0)} Z`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${grid}${lab}
    <path d="${area}" fill="${fill}" opacity="0.18"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linjoin="round" stroke-linecap="round"/>
  </svg>`;
}
function drawCharts(){
  const L=months(12);
  // near-zero with a small bump around FEB/MAR + minor Aug bump (matches screenshot)
  lineChart($("#chart-total"),{pts:[1,1,1,1,2,5,3,2,2,1,3,1],color:"#F4B740",fill:"#F4B740",labels:L});
  lineChart($("#chart-new"),{pts:[0,0,1,0,1,3,1,1,1,0,2,0],color:"#2E7DF1",fill:"#2E7DF1",labels:L});
}

/* flow */
function boot(){ setTimeout(()=>{ $("#splash").style.opacity=0;
  setTimeout(()=>{ $("#splash").classList.add("hide"); $("#login").classList.remove("hide"); },500); },1300); }
function enter(){ $("#login").classList.add("hide"); $("#splash").classList.add("hide");
  $("#shell").classList.remove("hide"); active="dashboard"; show('v-dashboard'); drawCharts(); }
function logout(){ $("#shell").classList.add("hide"); $("#login").classList.remove("hide"); }
boot();
</script>
